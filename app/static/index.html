<!doctype html><html><head><meta charset="utf-8"><title>Utility RAG Assistant</title>
<style>body{font-family:system-ui;max-width:780px;margin:2rem auto;padding:0 1rem}
#log div{margin:.6rem 0;padding:.6rem;border-radius:6px}.q{background:#eef}.a{background:#f4f4f4}
small{color:#555}input,select,button{font-size:1rem;padding:.4rem}</style></head><body>
<h1>Utility RAG Assistant</h1>
<p>Demo users: <b>guest</b> (public), <b>maria</b> (field-tech), <b>dev</b> and <b>tim</b> (cip-analyst). <a href="/metrics">metrics</a></p>
<select id="u"><option>guest</option><option>maria</option><option>dev</option><option>tim</option></select>
<input id="q" size="60" placeholder="Ask about CIP standards or outage procedures"><button onclick="ask()">Ask</button>
<div id="log"></div>
<script>
async function ask(){const q=document.getElementById('q').value,u=document.getElementById('u').value;
const log=document.getElementById('log');log.insertAdjacentHTML('afterbegin',`<div class=q>${u}: ${q}</div>`);
const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json','X-User':u},body:JSON.stringify({question:q})});
const j=await r.json();const src=j.sources.map(s=>`[${s.n}] ${s.title} (${s.label})`).join('<br>');
log.querySelector('.q').insertAdjacentHTML('afterend',`<div class=a>${j.answer}<br><small>${src}<br>role=${j.role} · ${j.latency_ms} ms · ${j.tokens_in}+${j.tokens_out} tokens · $${j.est_cost_usd}</small></div>`);}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
</script></body></html>
